name: integration

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25'
      - name: integration tests
        env:
          FASTNEAR_API_KEY: ${{ secrets.FASTNEAR_API_KEY }}
          FASTNEAR_INTEGRATION: '1'
        run: go test -tags=integration -v ./...
